# Builds Numstore for Windows and macOS on GitHub's machines and publishes them as a
# GitHub release (the store's auto-update reads these releases).
# Start it by pushing a tag that matches Store/package.json's version, e.g.:
#   git tag v0.2.0 && git push origin v0.2.0
# or by hand from the Actions tab ("Run workflow"), which builds without publishing.
name: Release Numstore

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
          - os: macos-latest
            target: --mac
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: Store
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Store/package-lock.json
      - run: npm ci
      - name: Check the tag matches the version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          v=$(node -p "require('./package.json').version")
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "tag ${GITHUB_REF_NAME} but package.json says $v"; exit 1; }
      - name: Pack the built-in apps
        run: node scripts/build-catalog.js
      - name: Build (and publish on a tag)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then pub=always; else pub=never; fi
          npx electron-builder ${{ matrix.target }} --publish $pub
      - uses: actions/upload-artifact@v4
        with:
          name: numstore-${{ matrix.os }}
          path: |
            Store/release/*.exe
            Store/release/*.dmg
            Store/release/*.zip
            Store/release/*.yml
            Store/release/*.blockmap
          if-no-files-found: ignore
