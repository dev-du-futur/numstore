<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <title>Numstore</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <img src="logo.png" alt="" class="logo">
      <div>
        <h1>Numstore</h1>
        <p class="tag">Apps for your NumWorks</p>
      </div>
    </div>
    <div class="search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Search apps" autocomplete="off">
    </div>
    <div id="calc" class="calc off">
      <span class="dot"></span>
      <div>
        <strong id="calc-title">No calculator</strong>
        <span id="calc-sub">Plug it in with a USB cable</span>
      </div>
    </div>
  </header>

  <section class="storage" id="storage">
    <div class="storage-head">
      <h2>Calculator storage</h2>
      <span id="storage-text">Connect your calculator to see its storage</span>
    </div>
    <div class="bar" id="bar"><div class="bar-empty"></div></div>
    <div class="legend" id="legend"></div>
  </section>

  <nav class="tabs" role="tablist">
    <button class="tab active" data-tab="store" role="tab">Store <span class="count" id="n-store"></span></button>
    <button class="tab" data-tab="device" role="tab">On my calculator <span class="count" id="n-device"></span></button>
    <div class="spacer"></div>
    <button class="ghost" id="add-file" title="Install a .nwa file from your computer">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg> Add a .nwa file
    </button>
  </nav>

  <main>
    <div id="view-store" class="grid"></div>
    <div id="view-device" class="list hidden"></div>
    <p id="online-note" class="note hidden"></p>
  </main>

  <div id="modal" class="modal hidden" role="dialog" aria-modal="true">
    <div class="sheet">
      <h3 id="m-title"></h3>
      <div id="m-body"></div>
      <div class="actions">
        <button class="ghost" id="m-cancel">Cancel</button>
        <button class="primary" id="m-ok">OK</button>
      </div>
    </div>
  </div>

  <div id="busy" class="modal hidden">
    <div class="sheet center">
      <div class="spinner"></div>
      <h3 id="b-title">Installing…</h3>
      <p id="b-text">Preparing…</p>
      <div class="progress"><div></div></div>
      <p class="warn">Keep the calculator plugged in and turned on.</p>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>
  <script src="app.js"></script>
</body>
</html>
