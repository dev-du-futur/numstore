<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <title>Numstore</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- like the calculator's own title bar: state on the left, title in the middle, storage on the right -->
  <header class="titlebar">
    <span id="calc-title" class="tb-left">NO CALCULATOR</span>
    <span class="tb-title">NUMSTORE</span>
    <span class="tb-right" title="Space for apps on the calculator"><span class="gauge"><span id="tb-batt"></span></span><span id="tb-free"></span></span>
  </header>

  <div id="update" class="notice hidden">
    <strong id="update-title"></strong>
    <span id="update-text"></span>
    <button class="key orange" id="update-btn">Restart now</button>
  </div>

  <div id="notice" class="notice hidden">
    <strong id="notice-title"></strong>
    <span id="calc-sub"></span>
  </div>

  <section class="storage" id="storage">
    <div class="storage-head">
      <h2>Storage</h2>
      <button class="key small hidden" id="extend-btn"></button>
    </div>
    <div class="srow">
      <span class="slabel" title="Flash memory for apps">Apps</span>
      <div class="bar" id="bar"></div>
      <span class="stext" id="storage-text">Connect your calculator to see its storage</span>
    </div>
    <div class="legend" id="legend"></div>
    <div class="srow hidden" id="files-row">
      <span class="slabel" title="The calculator's file list: games' saves, Python scripts">Files</span>
      <div class="bar thin" id="fbar"></div>
      <span class="stext" id="ftext"></span>
    </div>
    <div class="legend" id="flegend"></div>
  </section>

  <nav class="toolbar">
    <div class="tabs" role="tablist">
      <button class="key tab active" data-tab="store" role="tab">Store<span class="count" id="n-store"></span></button>
      <button class="key tab" data-tab="device" role="tab">On my calculator<span class="count" id="n-device"></span></button>
    </div>
    <div class="search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Search" autocomplete="off">
    </div>
    <button class="key" id="add-file" title="Install a .nwa file from your computer">Add a .nwa file</button>
  </nav>

  <main>
    <div id="restore" class="restore hidden"></div>
    <div id="progress-note" class="restore hidden"></div>
    <!-- how the store looks: cards, a list or icons; what it shows and in which order -->
    <div id="store-tools" class="store-tools">
      <div class="views" role="radiogroup" aria-label="Style">
        <button data-view="cards" title="Cards: full descriptions and sizes"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="8" height="8" rx="1.5"/><rect x="13" y="3" width="8" height="8" rx="1.5"/><rect x="3" y="13" width="8" height="8" rx="1.5"/><rect x="13" y="13" width="8" height="8" rx="1.5"/></svg>Cards</button>
        <button data-view="list" title="List: one app per line"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="4" height="4" rx="1"/><rect x="3" y="10" width="4" height="4" rx="1"/><rect x="3" y="16" width="4" height="4" rx="1"/><path d="M10 6h11M10 12h11M10 18h11"/></svg>List</button>
        <button data-view="icons" title="Icons: just the icons and names"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="5" height="5" rx="1"/><rect x="9.5" y="3" width="5" height="5" rx="1"/><rect x="16" y="3" width="5" height="5" rx="1"/><rect x="3" y="10" width="5" height="5" rx="1"/><rect x="9.5" y="10" width="5" height="5" rx="1"/><rect x="16" y="10" width="5" height="5" rx="1"/><path d="M3 19h5M9.5 19h5M16 19h5"/></svg>Icons</button>
      </div>
      <select id="f-show" class="pick" aria-label="Show">
        <option value="all">All apps</option>
        <option value="out">Not installed</option>
        <option value="in">Installed</option>
      </select>
      <select id="f-cat" class="pick" aria-label="Category"></select>
      <select id="f-author" class="pick" aria-label="Author"></select>
      <select id="f-sort" class="pick" aria-label="Sort">
        <option value="store">Store order</option>
        <option value="name">Name, A to Z</option>
        <option value="light">Lightest first</option>
        <option value="heavy">Heaviest first</option>
      </select>
      <span class="found" id="found"></span>
      <button class="link hidden" id="f-reset">Reset filters</button>
    </div>
    <div id="view-store" class="grid"></div>
    <div id="view-device" class="list hidden"></div>
    <p id="online-note" class="note hidden"></p>
    <p id="version" class="note"></p>
  </main>

  <!-- the basket: changes waiting to be applied together (one write, one restart) -->
  <div id="basket" class="basket hidden"></div>

  <div id="modal" class="modal hidden" role="dialog" aria-modal="true">
    <div class="sheet">
      <div class="sheet-bar" id="m-title"></div>
      <div class="sheet-body">
        <div id="m-body"></div>
        <div class="actions">
          <button class="key" id="m-cancel">Cancel</button>
          <button class="key orange" id="m-ok">OK</button>
        </div>
      </div>
    </div>
  </div>

  <div id="busy" class="modal hidden">
    <div class="sheet">
      <div class="sheet-bar" id="b-title">INSTALLING</div>
      <div class="sheet-body">
        <p id="b-text">Preparing…</p>
        <div class="progress"><div></div></div>
        <p class="hint">Keep the calculator plugged in and turned on.</p>
      </div>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>
  <script src="app.js"></script>
</body>
</html>
